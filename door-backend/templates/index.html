<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition Door System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 1.1em;
        opacity: 0.9;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .card h2 {
        margin-bottom: 20px;
        color: #333;
        font-size: 1.5em;
      }

      .camera-feed {
        width: 100%;
        border-radius: 8px;
        background: #000;
        margin-bottom: 15px;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
        margin-bottom: 10px;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-success {
        background: #48bb78;
        color: white;
      }

      .btn-success:hover {
        background: #38a169;
      }

      .btn-danger {
        background: #f56565;
        color: white;
        padding: 6px 12px;
        font-size: 14px;
        width: auto;
      }

      .btn-danger:hover {
        background: #e53e3e;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      .input-group input:focus {
        outline: none;
        border-color: #667eea;
      }

      .status-message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-weight: 500;
        display: none;
      }

      .status-success {
        background: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }

      .status-error {
        background: #fed7d7;
        color: #742a2a;
        border: 1px solid #fc8181;
      }

      .users-list {
        max-height: 300px;
        overflow-y: auto;
      }

      .user-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
      }

      .user-item:last-child {
        border-bottom: none;
      }

      .user-info {
        flex: 1;
      }

      .user-name {
        font-weight: 600;
        color: #333;
      }

      .user-confidence {
        font-size: 14px;
        color: #718096;
      }

      .logs-container {
        max-height: 400px;
        overflow-y: auto;
      }

      .log-entry {
        padding: 12px;
        border-left: 4px solid;
        margin-bottom: 10px;
        border-radius: 4px;
      }

      .log-granted {
        background: #c6f6d5;
        border-color: #48bb78;
      }

      .log-denied {
        background: #fed7d7;
        border-color: #f56565;
      }

      .log-error {
        background: #feebc8;
        border-color: #ed8936;
      }

      .log-time {
        font-size: 12px;
        color: #718096;
        margin-bottom: 4px;
      }

      .log-info {
        font-weight: 600;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-left: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .big-check-btn {
        font-size: 20px;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🔐 Face Recognition Door System</h1>
        <p class="subtitle">Secure access control powered by AWS Rekognition</p>
      </header>

      <div class="grid">
        <!-- Live Camera Feed -->
        <div class="card">
          <h2>📹 Live Camera</h2>
          <img
            src="{{ url_for('video_feed') }}"
            class="camera-feed"
            alt="Live Camera Feed"
          />
          <button class="btn btn-primary big-check-btn" onclick="checkFace()">
            🚪 Check Face & Unlock Door
          </button>
          <div id="checkStatus" class="status-message"></div>
        </div>

        <!-- Enroll New User -->
        <div class="card">
          <h2>➕ Enroll New User</h2>
          <div class="input-group">
            <label for="userName">Full Name</label>
            <input
              type="text"
              id="userName"
              placeholder="Enter user's name"
              autocomplete="off"
            />
          </div>
          <button class="btn btn-success" onclick="enrollUser()">
            📸 Capture & Enroll Face
          </button>
          <div id="enrollStatus" class="status-message"></div>

          <div
            style="
              margin-top: 20px;
              padding-top: 20px;
              border-top: 2px solid #e2e8f0;
            "
          >
            <h3 style="margin-bottom: 15px; color: #555">Enrolled Users</h3>
            <div id="usersList" class="users-list">
              <p style="text-align: center; color: #999">Loading users...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Access Logs -->
      <div class="card full-width">
        <h2>📊 Access Logs</h2>
        <div id="logsContainer" class="logs-container">
          <p style="text-align: center; color: #999">No access logs yet</p>
        </div>
      </div>
    </div>

    <script>
      // Check face and unlock door
      async function checkFace() {
        const btn = document.querySelector(".big-check-btn");
        const status = document.getElementById("checkStatus");

        btn.classList.add("loading");
        btn.innerHTML = '🔄 Checking face...<div class="spinner"></div>';
        status.style.display = "none";

        try {
          const response = await fetch("/check", { method: "POST" });
          const data = await response.json();

          if (data.access === "granted") {
            status.className = "status-message status-success";
            status.innerHTML = `✅ Access granted! Welcome, <strong>${data.name}</strong> (${data.confidence}% confidence)`;
            status.style.display = "block";
          } else if (data.error) {
            status.className = "status-message status-error";
            status.innerHTML = `❌ Error: ${data.error}`;
            status.style.display = "block";
          } else {
            status.className = "status-message status-error";
            status.innerHTML = "🚫 Access denied - Face not recognized";
            status.style.display = "block";
          }

          // Refresh logs
          loadLogs();
        } catch (error) {
          status.className = "status-message status-error";
          status.innerHTML = `❌ Error: ${error.message}`;
          status.style.display = "block";
        } finally {
          btn.classList.remove("loading");
          btn.innerHTML = "🚪 Check Face & Unlock Door";
        }
      }

      // Enroll new user
      async function enrollUser() {
        const userName = document.getElementById("userName").value.trim();
        const status = document.getElementById("enrollStatus");

        if (!userName) {
          status.className = "status-message status-error";
          status.innerHTML = "❌ Please enter a name";
          status.style.display = "block";
          return;
        }

        const btn = event.target;
        btn.classList.add("loading");
        status.style.display = "none";

        // 3-second countdown to position face
        for (let i = 3; i > 0; i--) {
          status.className = "status-message status-success";
          status.innerHTML = `📸 Get ready! Capturing in ${i}...`;
          status.style.display = "block";
          btn.innerHTML = `📸 Capturing in ${i}...<div class="spinner"></div>`;
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }

        btn.innerHTML = '📸 Capturing...<div class="spinner"></div>';

        try {
          const response = await fetch("/enroll", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: userName }),
          });

          const data = await response.json();

          if (data.success) {
            status.className = "status-message status-success";
            status.innerHTML = `✅ ${data.name} enrolled successfully! (${data.confidence}% confidence)`;
            status.style.display = "block";
            document.getElementById("userName").value = "";
            loadUsers();
          } else {
            status.className = "status-message status-error";
            status.innerHTML = `❌ ${data.error}<br><small>💡 Tip: Ensure good lighting, face the camera directly, and get closer to the camera.</small>`;
            status.style.display = "block";
          }
        } catch (error) {
          status.className = "status-message status-error";
          status.innerHTML = `❌ Error: ${error.message}`;
          status.style.display = "block";
        } finally {
          btn.classList.remove("loading");
          btn.innerHTML = "📸 Capture & Enroll Face";
        }
      }

      // Load enrolled users
      async function loadUsers() {
        try {
          const response = await fetch("/users");
          const data = await response.json();
          const container = document.getElementById("usersList");

          if (data.users.length === 0) {
            container.innerHTML =
              '<p style="text-align: center; color: #999;">No users enrolled yet</p>';
            return;
          }

          container.innerHTML = data.users
            .map(
              (user) => `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-name">👤 ${user.name}</div>
                            <div class="user-confidence">Confidence: ${user.confidence}%</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteUser('${user.name}')">Delete</button>
                    </div>
                `,
            )
            .join("");
        } catch (error) {
          console.error("Error loading users:", error);
        }
      }

      // Delete user
      async function deleteUser(name) {
        if (!confirm(`Are you sure you want to delete ${name}?`)) {
          return;
        }

        try {
          const response = await fetch(`/users/${encodeURIComponent(name)}`, {
            method: "DELETE",
          });

          const data = await response.json();

          if (data.success) {
            loadUsers();
          } else {
            alert(`Error: ${data.error}`);
          }
        } catch (error) {
          alert(`Error: ${error.message}`);
        }
      }

      // Load access logs
      async function loadLogs() {
        try {
          const response = await fetch("/logs");
          const data = await response.json();
          const container = document.getElementById("logsContainer");

          if (data.logs.length === 0) {
            container.innerHTML =
              '<p style="text-align: center; color: #999;">No access logs yet</p>';
            return;
          }

          container.innerHTML = data.logs
            .map((log) => {
              let className = "log-entry ";
              let icon = "";
              let text = "";

              if (log.access === "granted") {
                className += "log-granted";
                icon = "✅";
                text = `Access granted - <strong>${log.name}</strong> (${log.confidence}% confidence)`;
              } else if (log.access === "denied") {
                className += "log-denied";
                icon = "🚫";
                text = "Access denied - Face not recognized";
              } else {
                className += "log-error";
                icon = "⚠️";
                text = `Error - ${log.reason}`;
              }

              return `
                        <div class="${className}">
                            <div class="log-time">${log.timestamp}</div>
                            <div class="log-info">${icon} ${text}</div>
                        </div>
                    `;
            })
            .join("");
        } catch (error) {
          console.error("Error loading logs:", error);
        }
      }

      // Auto-refresh logs every 5 seconds
      setInterval(loadLogs, 5000);

      // Load initial data
      loadUsers();
      loadLogs();
    </script>
  </body>
</html>
